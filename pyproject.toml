[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dzen-frame-bot"
version = "0.1.0"
description = "Telegram bot that frames user photos for the DZEN award"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.26,<4.0",
    "mediapipe>=0.10,<0.11",
    "pillow>=12.1,<13.0",
    "python-dotenv>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0",
]

[project.scripts]
dzen-frame-bot = "dzen_frame_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dzen_frame_bot = ["resources/*.md", "resources/*.png", "resources/*.tflite"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
